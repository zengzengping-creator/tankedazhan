<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>坦克大战 Tank Battle</title>
  <link rel="stylesheet" href="style.css?v=20260906-4">
</head>
<body>
  <div id="game-container">
    <header>
      <h1>🚀 坦克大战</h1>
      <div id="hud">
        <span>关卡: <b id="level">1</b></span>
        <span>玩家血量: <b id="lives">5</b></span>
        <span>基地血量: <b id="base-hp">3</b></span>
        <span>坦克: <b id="player-tank-name">普通坦克</b></span>
        <span>技能: <b id="skill-status">Q 钢铁护盾</b></span>
        <span>得分: <b id="score">0</b></span>
        <span>剩余敌人: <b id="enemies-left">0</b></span>
      </div>
    </header>

    <div id="canvas-wrap">
      <canvas id="game" width="520" height="520"></canvas>

      <div id="overlay" class="overlay">
        <div class="panel">
          <h2 id="overlay-title">坦克大战</h2>
          <p id="overlay-text">选择你的坦克，然后开始游戏。<br>方向键移动，空格开火，Q键释放坦克技能。</p>

          <div id="tank-select" class="tank-select">
            <button type="button" class="tank-choice selected" data-player-tank="normal">
              <span class="tank-choice-title">🟨 普通坦克</span>
              <span>均衡型 · 5滴血</span>
              <small>技能：4秒无敌护盾</small>
            </button>
            <button type="button" class="tank-choice" data-player-tank="fast">
              <span class="tank-choice-title">🟦 快速坦克</span>
              <span>高速移动 · 5滴血</span>
              <small>技能：3秒极速冲刺</small>
            </button>
            <button type="button" class="tank-choice" data-player-tank="elite">
              <span class="tank-choice-title">🟪 精英坦克</span>
              <span>射速更快 · 5滴血</span>
              <small>技能：5秒火力爆发</small>
            </button>
            <button type="button" class="tank-choice" data-player-tank="armor">
              <span class="tank-choice-title">⬜ 重甲坦克</span>
              <span>速度较慢 · 10滴血</span>
              <small>技能：立即恢复2滴血</small>
            </button>
            <button type="button" class="tank-choice" data-player-tank="base">
              <span class="tank-choice-title">🟩 基地坦克</span>
              <span>较快移动/射速 · 5滴血 · 2伤害</span>
              <small>基地变5滴血；技能：基地恢复2滴</small>
            </button>
            <button type="button" class="tank-choice" data-player-tank="omni">
              <span class="tank-choice-title">🟧 全能坦克</span>
              <span>10滴血 · 基地5滴 · 2伤害</span>
              <small>技能：五种能力同时发动</small>
            </button>
          </div>
          <div class="free-note">当前全部免费选择，暂不需要金币。</div>

          <button type="button" id="start-btn">开始游戏</button>
        </div>
      </div>
    </div>

    <div id="controls">
      <p>⬆️⬇️⬅️➡️ 移动 &nbsp;|&nbsp; <b>空格</b> 开火 &nbsp;|&nbsp; <b>Q</b> 技能 &nbsp;|&nbsp; <b>P</b> 暂停</p>
    </div>
  </div>

  <script src="game.js?v=20260906-4"></script>
  <script src="spawn-fix.js?v=20260906-4"></script>
  <script src="drop-rates.js?v=20260906-4"></script>
  <script src="levels-45.js?v=20260906-4"></script>
  <script src="levels-610.js?v=20260906-4"></script>
  <script src="health.js?v=20260906-4"></script>
  <script src="boss-mechanics.js?v=20260906-4"></script>
  <script src="player-tanks.js?v=20260906-4"></script>
  <script src="omni-tank.js?v=20260906-4"></script>
</body>
</html>
